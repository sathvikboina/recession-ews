# Runtime scope for the build. Edit here, not in code.
# Version 2 records the D-R31 window extension to 2026Q3 (label v3); the
# Phase 2 rules themselves are unchanged. See docs/BUILD_CONTRACT.md.
version: 2
frozen_on: "2026-11-06"

window:
  # Reporting window for every country and the coverage gate.
  start: "1990Q1"
  end: "2026Q3"
  # Sample start per country. null = dynamic derivation (earliest quarter with >= 4 indicators)
  sample_start:
    USA: "1960Q1"
    JPN: null      # dynamic: resolves to 1994Q2 under >= 4 indicators rule (C-03)
    DEU: "1991Q2"  # post-reunification structural break (Destatis ESA 2010 boundary)
  # The USA factor is estimated with pre-1990 context so the left endpoint
  # does not censor the 1990-91 peak (D-R22). Labels are still reported for
  # the window above only.
  estimation_start: "1960Q1"
  extended_history:
    enabled: false
    suggested:
      USA: "1960Q1"
      JPN: "1980Q1"
      DEU: "1970Q1"
      GBR: "1970Q1"
      FRA: "1970Q1"
      ITA: "1970Q1"
      CAN: "1970Q1"

horizons: [1, 2, 4]
primary_horizon: 2

countries:
  tier1: [USA, JPN, IND]
  tier2: [GBR, FRA, ITA, CAN, DEU]
  # Start small. Add countries only after the label gate (Step 8) passes.
  enabled: [USA, JPN, DEU]
  panel: []          # broad OECD panel is off the critical path
  include_global: true   # GLOBAL predictor rows (oil, VIX, world IP ...)

indicators:
  # Collection priorities included in the first build.
  priorities: [P0, P1]
  # Hard overrides. Empty = use everything at the priorities above.
  only: []
  exclude:
    - SEN_CLI          # comparator only, never a feature (FW / §63)
    - ACT_POP          # support input; keep only if per-capita features are built
  # The eight §11 core coincident indicators. Do not edit without changing §11/§19.
  core:
    - ACT_GDP_REAL
    - ACT_IP
    - ACT_EMP
    - ACT_HOURS
    - ACT_RINC
    - ACT_CONS
    - ACT_RETAIL
    - ACT_INV

coverage:
  min_quarters_pct: 70        # §19, of the 147-quarter window (>= 103 quarters)
  min_core_indicators: 6      # §19, of the eight
  min_indicators_per_quarter: 4   # §18, to date a quarter

firewall:
  # Q-01: unemployment is predictor-only. This is the Phase 2 decision.
  unemployment_in_beai: false
  # Only these may ever be beai_eligible = Y.
  beai_indicators:
    - ACT_GDP_REAL
    - ACT_IP
    - ACT_EMP
    - ACT_HOURS
    - ACT_RINC
    - ACT_CONS
    - ACT_RETAIL
    - ACT_INV

labels:
  primary: BEAI
  robustness: [TECH_GDP, NBER_US]

paths:
  catalogue: series_catalogue.csv
  scope_out: data/scope.csv
  coverage_out: data/scope_coverage.csv
  raw: data/raw
  interim: data/interim
  clean: data/clean
  labels: outputs/labels
  folds: outputs/folds
  results: outputs/results
  figures: outputs/figures
