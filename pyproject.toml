[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recession-ews"
version = "0.1.0"
description = "Cross-country recession early-warning: BEAI labels, REWI, walk-forward evaluation"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "shap>=0.45",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "requests>=2.31",
  "pyarrow>=15.0",
  "openpyxl>=3.1",
  "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
